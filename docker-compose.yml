services:
  apache:
    build:
        context: .
        dockerfile: Dockerfile
    container_name: SWEB-apache-php8.3
    networks:
      - app-network
    extra_hosts:
        - "host.docker.internal:host-gateway"
    volumes:
        - ./site:/var/www/html
        - ./config/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
        - ./config/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    ports:
        - 8000:80
    depends_on:
        - mysql
        
  mysql:
    image: mysql:8.0.35 # version stable de MySQL
    container_name: SBDD-mysql
    networks:
      - app-network
    environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_USER: admin
        MYSQL_PASSWORD: mdp@dm1nTPphp
    volumes:
        - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
        - ./database/retrogamein.sql:/docker-entrypoint-initdb.d/02-retrogamein.sql
        - ./database/db_data:/var/lib/mysql
    ports:
        - "3306:3306"
  
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: Sweb-phpmyadmin
    networks:
      - app-network
    environment:
        PMA_HOST: mysql
        PMA_PORT: 3306
        PMA_USER: admin
        PMA_PASSWORD: mdp@dm1nTPphp
    ports:
        - '8080:80'
    depends_on:
        - mysql

networks:
  app-network:
    driver: bridge